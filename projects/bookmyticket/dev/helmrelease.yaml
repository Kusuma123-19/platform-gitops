apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookmyticket
  namespace: bookmyticket-dev
spec:
  interval: 5m
  chart:
    spec:
      chart: ./catalogs/bookmyticket/0.1.0
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: bookmyticket-values